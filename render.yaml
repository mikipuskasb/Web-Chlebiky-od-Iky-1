# Skúšobný web: plne funkčný backend, bez trvalého disku.
# Databáza sa pri novom nasadení alebo reštarte služby môže vymazať.
# Pre skutočné objednávky použite platený trvalý disk podľa README.md.
services:
  - type: web
    name: chlebiky-od-iky
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/chlebiky-data
      - key: COOKIE_SECURE
        value: "true"
      - key: ADMIN_TOKEN
        generateValue: true
